spring:
  application:
    name: ProductService
  cloud:
    consul:
      host: localhost
      port: 8501
      discovery:
        enabled: true
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}
    openfeign:
      circuitbreaker:
        enabled: true

server:
  port: 8090

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans